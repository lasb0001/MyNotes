<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Notes</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lockScreen" class="lock-screen">
    <h2>🔒 My Notes</h2>

    <p>Enter PIN</p>

    <input type="password" maxlength="4" id="pinInput" placeholder="****">

    <button onclick="unlockApp()">Unlock</button>

    <button onclick="setPin()">Set New PIN</button>
</div>

<div class="container" id="app">

<div class="header">

<h1>📝 My Notes</h1>

<button class="dark-btn" onclick="toggleDarkMode()">🌙</button>

</div>

<input
id="searchInput"
type="text"
placeholder="🔍 Search notes..."
onkeyup="displayNotes()">

<div class="toolbar">

<select id="labelColor">

<option value="#ffffff">⚪ White</option>

<option value="#fff176">🟡 Yellow</option>

<option value="#81d4fa">🔵 Blue</option>

<option value="#a5d6a7">🟢 Green</option>

<option value="#ef9a9a">🔴 Red</option>

<option value="#ce93d8">🟣 Purple</option>

</select>

<button onclick="backupNotes()">⬆ Backup</button>

<button onclick="restoreNotes()">⬇ Restore</button>

</div>

<input
id="noteInput"
type="text"
placeholder="Write your note...">

<button class="add-btn"
onclick="addNote()">

➕ Add Note

</button>

<ul id="notesList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
