<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>

<h1>📝 My Notes</h1>

<button class="darkBtn" onclick="toggleDarkMode()">
🌙
</button>

</header>

<input
id="searchInput"
type="text"
placeholder="🔍 Search notes..."
onkeyup="displayNotes()">

<select id="labelColor">

<option value="#ffffff">⚪ White</option>
<option value="#fff59d">🟡 Yellow</option>
<option value="#a5d6a7">🟢 Green</option>
<option value="#90caf9">🔵 Blue</option>
<option value="#ef9a9a">🔴 Red</option>
<option value="#ce93d8">🟣 Purple</option>

</select>

<input
id="noteInput"
type="text"
placeholder="Write your note...">

<button class="addBtn" onclick="addNote()">

➕ Add Note

</button>

<ul id="notesList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
