name: Build Signed Release APK

on:
  push:
    branches:
      - Las-B

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync Code to Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode Keystore and Properties
        run: |
          # Recreates your keystore file directly inside the android folder
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > android/mynotes-release.jks
          
          # Recreates your key.properties file inside the android folder
          cat <<EOF > android/key.properties
          storeFile=mynotes-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

